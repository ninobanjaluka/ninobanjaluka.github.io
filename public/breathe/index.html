<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>ニノの息 — Breathing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --bg-2: #030805;
    --surface: #060F09;
    --surface-2: #0A160D;
    --border: #123420;
    --border-bright: #1E5C36;
    --text: #D6FFE2;
    --text-dim: #5C9271;
    --text-faint: #2C4936;
    --accent: #39FF14;
    --accent-soft: #39FF1426;
    --amber: #FFD400;
    --danger: #FF3B3B;
    --radius: 0px;
    --pad: 20px;
  }
  *,*::before,*::after{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; border-radius:0 !important; }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    min-height:100vh;
    overscroll-behavior:none;
    position:relative;
  }
  #rain{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.16;
  }
  .scanlines{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.35) 0px, rgba(0,0,0,0.35) 1px, transparent 1px, transparent 3px);
    opacity:0.35; mix-blend-mode:overlay;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    z-index:1;
    padding-bottom:40px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px var(--pad) 8px;
    gap:8px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(16px,5vw,20px);
    font-weight:700;
    letter-spacing:0.5px;
    white-space:nowrap;
    color:var(--accent);
    text-shadow:0 0 6px var(--accent-soft), 0 0 1px var(--accent);
    animation: glitch 7s infinite;
  }
  .cursor{ animation: blink 1s step-end infinite; color:var(--accent); }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes glitch{
    0%, 92%, 100%{ text-shadow:0 0 6px var(--accent-soft), 0 0 1px var(--accent); transform:translate(0,0); }
    93%{ text-shadow:-2px 0 var(--danger), 2px 0 #00E5FF; transform:translate(-1px,0); }
    94%{ text-shadow:2px 0 var(--danger), -2px 0 #00E5FF; transform:translate(1px,0); }
    95%{ text-shadow:0 0 6px var(--accent-soft); transform:translate(0,0); }
  }
  .toggles{ display:flex; gap:7px; flex-shrink:0; }
  .icon-btn{
    min-width:36px; height:36px; padding:0 8px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer; font-size:14px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn.active{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
  .icon-btn:active{ transform: scale(0.94); }
  #langToggle{ font-weight:700; font-size:11.5px; letter-spacing:.5px; }

  /* ---------- Category tabs ---------- */
  .tabs{
    display:flex; gap:8px; padding:14px var(--pad) 4px;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:clamp(11px,3.2vw,12.5px); font-weight:700;
    cursor:pointer; white-space:nowrap;
    transition:.15s;
    text-transform:uppercase; letter-spacing:.6px;
  }
  .tab.active{ color:#000; border-color:transparent; }

  .category-block{ padding:18px var(--pad) 6px; }
  .category-title{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(19px,6vw,24px); font-weight:800; margin:6px 0 8px;
    text-transform:uppercase; letter-spacing:1px;
  }
  .category-desc{
    color:var(--text-dim); font-size:clamp(12.5px,3.5vw,14px); line-height:1.55; margin:0 0 18px;
    max-width:42ch;
  }

  /* ---------- Cards grid ---------- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:0 var(--pad) 10px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    padding:14px 12px 12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: border-color .15s, background .15s, box-shadow .15s;
    min-height:104px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .card:active{ transform: scale(0.98); }
  .card:hover{ border-color:var(--accent); box-shadow:0 0 14px var(--accent-soft); }
  .card-name{
    font-weight:700; font-size:clamp(14.5px,4.4vw,17px); margin-bottom:6px; position:relative;
    line-height:1.2; text-transform:uppercase; letter-spacing:.3px;
  }
  .card-pattern{
    font-size:clamp(10.5px,2.9vw,12.5px); color:var(--text-dim); letter-spacing:2px;
    margin-bottom:10px; position:relative;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; position:relative;
  }
  .level{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  }
  .level.Easy{ color:var(--accent); }
  .level.Intermediate{ color:var(--amber); }
  .level.Complex{ color:var(--danger); }
  .level.Custom{ color:#00E5FF; }

  .add-card{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    border:1px dashed var(--border-bright); background:transparent;
    min-height:104px; cursor:pointer; color:var(--text-dim); text-align:center;
    transition:border-color .15s, color .15s;
  }
  .add-card:hover{ border-color:#00E5FF; color:#00E5FF; }
  .add-card .plus{ font-size:26px; color:#00E5FF; line-height:1; }
  .add-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; }
  .card-arrow{
    width:24px; height:24px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); font-size:13px;
    border:1px solid var(--border-bright);
  }

  /* ---------- Session sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
    z-index:50;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px;
    background:var(--bg-2);
    border:1px solid var(--border-bright); border-bottom:none;
    padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
    box-shadow:0 0 30px var(--accent-soft);
  }
  .sheet-overlay.show .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:3px; background:var(--border-bright);
    margin:0 auto 16px;
  }
  .sheet-head-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .sheet-title{ font-size:clamp(19px,5.6vw,22px); font-weight:800; margin:0 0 4px; text-transform:uppercase; letter-spacing:.6px; }
  .sheet-sub{ color:var(--text-dim); font-size:12.5px; margin:0 0 16px; text-transform:uppercase; letter-spacing:.5px; }
  .delete-btn{
    width:34px; height:34px; background:var(--surface); border:1px solid var(--danger);
    color:var(--danger); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; font-size:14px;
  }
  .text-input{
    width:100%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-family:'JetBrains Mono', monospace; font-size:14px;
    padding:12px 12px; outline:none; transition:border-color .15s;
  }
  .text-input:focus{ border-color:#00E5FF; }
  .text-input.err{ border-color:var(--danger); }
  .pattern-inputs{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:6px; }
  .stepper{
    background:var(--surface); border:1px solid var(--border);
    padding:9px 4px; display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .stepper .lbl{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.3px; }
  .stepper .row{ display:flex; align-items:center; gap:6px; }
  .stepper .stp-btn{
    width:22px; height:22px; background:var(--bg-2); border:1px solid var(--border);
    color:#00E5FF; font-weight:700; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .stepper .val{ font-size:15px; font-weight:700; min-width:16px; text-align:center; }
  .swatches{ display:flex; gap:8px; margin-bottom:6px; }
  .swatch{
    width:30px; height:30px; border:2px solid var(--border); cursor:pointer; flex-shrink:0;
  }
  .swatch.active{ border-color:var(--text); }
  .phase-preview{
    display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;
  }
  .phase-chip{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface); border:1px solid var(--border);
    padding:7px 6px; flex:1; min-width:62px;
  }
  .phase-chip .n{ font-size:16px; font-weight:700; }
  .phase-chip .l{ font-size:9px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }
  .field-label{ font-size:11.5px; color:var(--text-dim); font-weight:700; text-transform:uppercase; letter-spacing:.6px; margin:14px 0 8px; }
  .cycle-options{ display:flex; gap:7px; }
  .cycle-opt{
    flex:1; padding:11px 0; text-align:center;
    background:var(--surface); border:1px solid var(--border);
    font-weight:700; font-size:13.5px;
    color:var(--text-dim); cursor:pointer; transition:.15s;
  }
  .cycle-opt.active{ color:#000; border-color:transparent; }
  .begin-btn{
    width:100%; margin-top:20px; padding:15px; border:1px solid transparent;
    font-family:'JetBrains Mono', monospace; font-weight:800; font-size:15px; color:#000;
    cursor:pointer; letter-spacing:1px; text-transform:uppercase;
  }

  /* ---------- Session screen ---------- */
  .session{
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:60;
  }
  .session.show{ transform:translateY(0); }
  .session-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top)) 16px 0;
    gap:8px;
  }
  .close-btn, .mini-toggle{
    width:38px;height:38px;background:var(--surface);
    border:1px solid var(--border); display:flex;align-items:center;justify-content:center;
    color:var(--text-dim); cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .session-title{ text-align:center; min-width:0; overflow:hidden; }
  .session-title .name{ font-weight:800; font-size:clamp(13px,3.8vw,15px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-transform:uppercase; letter-spacing:.5px; }
  .session-title .cycles{ font-size:10px; color:var(--text-dim); letter-spacing:.8px; }
  .mini-toggles{ display:flex; gap:7px; flex-shrink:0; }

  .stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; padding:14px;
    min-height:0;
  }
  .orb-wrap{
    position:relative;
    width:min(280px, 62vw, 42vh);
    height:min(280px, 62vw, 42vh);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .ring-svg{ position:absolute; inset:0; width:100%; height:100%; filter:drop-shadow(0 0 6px var(--accent)); }
  .ring-bg{ fill:none; stroke:var(--border); stroke-width:3; }
  .ring-progress{ fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:square; transition:none; }
  .orb-glow{
    position:absolute; width:90%; height:90%;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 72%);
    filter:blur(4px);
  }
  .orb{
    width:62%; height:62%;
    background: repeating-linear-gradient(135deg, #ffffff10 0px, #ffffff10 2px, transparent 2px, transparent 10px), var(--accent);
    box-shadow: 0 0 50px var(--accent-soft), inset 0 0 30px rgba(0,0,0,0.35);
    border:1px solid var(--border-bright);
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
  }
  .orb .count{
    font-size:clamp(28px,9vw,44px); font-weight:800; color:#000;
  }
  .phase-label{
    font-size:clamp(19px,6vw,27px); font-weight:800; margin-top:clamp(14px,4vh,30px);
    color:var(--text); min-height:34px; text-align:center; letter-spacing:1px;
    text-transform:uppercase;
  }
  .cycle-dots{ display:flex; gap:5px; margin-top:12px; flex-wrap:wrap; justify-content:center; max-width:260px; }
  .cycle-dot{ width:7px; height:7px; background:var(--border); transition:.2s; flex-shrink:0; }
  .cycle-dot.done{ background:var(--accent); }
  .cycle-dot.current{ background:var(--text); transform:scale(1.3); }

  .session-bottom{
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:14px;
    flex-shrink:0;
  }
  .ctrl-btn{
    width:52px; height:52px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text);
    cursor:pointer; font-size:17px; flex-shrink:0;
  }
  .ctrl-btn.primary{ background:var(--accent); color:#000; width:66px; height:66px; font-size:21px; border:1px solid var(--border-bright); }
  .hint{ text-align:center; color:var(--text-faint); font-size:11px; padding-bottom:4px; min-height:16px; flex-shrink:0; letter-spacing:.5px; text-transform:uppercase; }

  /* ---------- Complete overlay ---------- */
  .complete{
    position:absolute; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s; text-align:center; padding:24px;
  }
  .complete.show{ opacity:1; pointer-events:auto; }
  .complete .check{
    width:64px;height:64px; background:var(--accent-soft); color:var(--accent);
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:26px; margin-bottom:16px;
  }
  .complete h2{ font-size:clamp(19px,5.6vw,24px); margin:0 0 6px; text-transform:uppercase; letter-spacing:.8px; }
  .complete p{ color:var(--text-dim); font-size:13px; margin:0 0 22px; max-width:32ch; }
  .complete-stats{ display:flex; gap:24px; margin-bottom:26px; }
  .complete-stats div{ text-align:center; }
  .complete-stats .v{ font-size:20px; font-weight:800; color:var(--accent); }
  .complete-stats .k{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }
  .complete-actions{ display:flex; gap:10px; width:100%; max-width:280px; }
  .complete-actions button{
    flex:1; padding:13px; font-weight:700; font-size:13px; cursor:pointer;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .btn-ghost{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .btn-solid{ background:var(--accent); border:1px solid var(--border-bright); color:#000; }

  @media (max-width:360px){
    :root{ --pad:14px; }
    .topbar{ padding-top:16px; }
    .icon-btn{ min-width:32px; height:32px; font-size:12px; }
    .grid{ gap:8px; }
    .card{ padding:11px 10px 10px; min-height:92px; }
    .card-arrow{ width:21px; height:21px; }
    .phase-chip{ min-width:52px; padding:6px 4px; }
    .cycle-opt{ padding:9px 0; font-size:12px; }
    .ctrl-btn{ width:46px; height:46px; font-size:15px; }
    .ctrl-btn.primary{ width:58px; height:58px; font-size:18px; }
  }
  @media (max-height:680px){
    .phase-label{ margin-top:10px; }
    .cycle-dots{ margin-top:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .sheet, .session, .complete, .brand{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="scanlines"></div>
<div class="app">

  <div class="topbar">
    <div class="brand">ニノの息<span class="cursor">_</span></div>
    <div class="toggles">
      <div class="icon-btn" id="langToggle" title="Jezik / Language">EN</div>
      <div class="icon-btn active" id="soundToggle" title="Sound cues">🔊</div>
      <div class="icon-btn active" id="vibeToggle" title="Vibration cues">📳</div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="category-block">
    <div class="category-title" id="catTitle"></div>
    <p class="category-desc" id="catDesc"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Pre-session config sheet -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head-row">
      <div class="sheet-title" id="sheetTitle">Exercise</div>
      <div class="delete-btn" id="deleteExerciseBtn" style="display:none">🗑</div>
    </div>
    <p class="sheet-sub" id="sheetSub">Easy · Rest & Relax</p>
    <div class="phase-preview" id="phasePreview"></div>
    <div class="field-label" id="lengthLabel">Session length</div>
    <div class="cycle-options" id="cycleOptions"></div>
    <button class="begin-btn" id="beginBtn">Begin</button>
  </div>
</div>

<!-- Create custom exercise sheet -->
<div class="sheet-overlay" id="createOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="createTitle">Create Exercise</div>
    <div class="field-label" id="nameFieldLabel">Name</div>
    <input type="text" id="exNameInput" class="text-input" maxlength="24" placeholder="e.g. Deep Reset">
    <div class="field-label" id="patternFieldLabel">Pattern (seconds)</div>
    <div class="pattern-inputs" id="patternInputs"></div>
    <div class="field-label" id="colorFieldLabel">Color</div>
    <div class="swatches" id="swatches"></div>
    <div class="phase-preview" id="createPreview"></div>
    <button class="begin-btn" id="saveExerciseBtn">Save</button>
  </div>
</div>

<!-- Session screen -->
<div class="session" id="session">
  <div class="session-top">
    <div class="close-btn" id="sessionClose">✕</div>
    <div class="session-title">
      <div class="name" id="sessName">Exercise</div>
      <div class="cycles" id="sessCycles">CYCLE 1 / 8</div>
    </div>
    <div class="mini-toggles">
      <div class="mini-toggle" id="sessSound">🔊</div>
      <div class="mini-toggle" id="sessVibe">📳</div>
    </div>
  </div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="orb-glow"></div>
      <svg class="ring-svg" viewBox="0 0 280 280">
        <rect class="ring-bg" x="8" y="8" width="264" height="264"></rect>
        <rect class="ring-progress" id="ringProgress" x="8" y="8" width="264" height="264" stroke-dasharray="1056" stroke-dashoffset="1056"></rect>
      </svg>
      <div class="orb" id="orb"><div class="count" id="count">3</div></div>
    </div>
    <div class="phase-label" id="phaseLabel">Get ready</div>
    <div class="cycle-dots" id="cycleDots"></div>

    <div class="complete" id="complete">
      <div class="check">✓</div>
      <h2 id="completeTitle">Session complete</h2>
      <p id="completeSub">Nicely done. Notice how you feel.</p>
      <div class="complete-stats">
        <div><div class="v" id="statCycles">8</div><div class="k" id="statCyclesLabel">Cycles</div></div>
        <div><div class="v" id="statTime">3:12</div><div class="k" id="statTimeLabel">Time</div></div>
      </div>
      <div class="complete-actions">
        <button class="btn-ghost" id="completeDone">Done</button>
        <button class="btn-solid" id="completeAgain">Repeat</button>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Tap to begin</div>
  <div class="session-bottom">
    <div class="ctrl-btn" id="stopBtn">✕</div>
    <div class="ctrl-btn primary" id="playPauseBtn">▶</div>
    <div class="ctrl-btn" id="skipBtn">⏭</div>
  </div>
</div>

<script>
/* ============ MATRIX RAIN ============ */
(function(){
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,cols,drops,fontSize=15;
  const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ﾊﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛ';
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w/fontSize);
    drops = new Array(cols).fill(0).map(()=> Math.random()*-40);
  }
  window.addEventListener('resize', resize);
  resize();
  function draw(){
    if(document.hidden || reduceMotion){ return; }
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#39FF14';
    ctx.font = fontSize+'px monospace';
    for(let i=0;i<cols;i++){
      const ch = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(ch, i*fontSize, drops[i]*fontSize);
      if(drops[i]*fontSize > h && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  if(!reduceMotion){ setInterval(draw, 70); }
})();

/* ============ AUDIO ============ */
let actx = null;
function ensureAudio(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); }
function tone(freqStart, freqEnd, duration, type='sine', peakGain=0.09){
  if(!soundOn || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,40), t0+duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peakGain, t0+Math.min(0.35,duration*0.3));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+duration+0.05);
  return {osc, gain};
}
function chime(freq1, freq2){
  if(!soundOn || !actx) return;
  const t0 = actx.currentTime;
  [freq1, freq2].forEach((f,i)=>{
    if(!f) return;
    const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(f, t0+i*0.09);
    gain.gain.setValueAtTime(0.0001, t0+i*0.09);
    gain.gain.exponentialRampToValueAtTime(0.16, t0+i*0.09+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.09+0.28);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0+i*0.09); osc.stop(t0+i*0.09+0.3);
  });
}
function playPhaseCue(key, duration){
  if(!soundOn) return;
  ensureAudio();
  if(key==='Inhale'){ chime(392,523); tone(220,440,duration,'sine',0.05); }
  else if(key==='Exhale'){ chime(523,392); tone(440,220,duration,'sine',0.05); }
  else { chime(330,330); }
}
function vibratePhase(key){
  if(!vibeOn || !navigator.vibrate) return;
  if(key==='Inhale') navigator.vibrate([50]);
  else if(key==='Exhale') navigator.vibrate([90]);
  else navigator.vibrate([25,60,25]);
}

/* ============ SESSION ENGINE ============ */
const sessionEl = document.getElementById('session');
const orb = document.getElementById('orb');
const countEl = document.getElementById('count');
const phaseLabelEl = document.getElementById('phaseLabel');
const ringProgress = document.getElementById('ringProgress');
const sessName = document.getElementById('sessName');
const sessCycles = document.getElementById('sessCycles');
const cycleDots = document.getElementById('cycleDots');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');
const playPauseBtn = document.getElementById('playPauseBtn');
const RING_PERIM = 1056;
ringProgress.setAttribute('stroke-dasharray', RING_PERIM);

let phases = [];
let phaseIdx = 0;
let cycleIdx = 0;
let totalCycles = 8;
let remainingMs = 0;
let phaseDurMs = 0;
let running = false;
let paused = true;
let tickTimer = null;
let currentAnim = null;
let color = '#39FF14';

function buildPhases(pattern){
  return pattern.map((sec,i)=>({key:PHASE_KEYS[i], idx:i, dur:sec})).filter(p=>p.dur>0);
}

function startSession(ex, col, cycles){
  color = col; totalCycles = cycles;
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-soft', color+'33');
  phases = buildPhases(ex.pattern);
  phaseIdx = -1; cycleIdx = 0;
  sessName.textContent = ex.name[LANG];
  orb.style.background = `repeating-linear-gradient(135deg, #ffffff10 0px, #ffffff10 2px, transparent 2px, transparent 10px), ${color}`;
  orb.style.boxShadow = `0 0 50px ${color}55, inset 0 0 30px rgba(0,0,0,0.35)`;
  document.querySelector('.orb-glow').style.background = `radial-gradient(circle, ${color}44 0%, transparent 72%)`;
  ringProgress.style.stroke = color;
  document.querySelector('.ring-svg').style.filter = `drop-shadow(0 0 6px ${color})`;
  buildDots();
  completeEl.classList.remove('show');
  phaseLabelEl.textContent = t().getReady;
  countEl.textContent = '';
  ringProgress.setAttribute('stroke-dashoffset', RING_PERIM);
  orb.style.transform = 'scale(0.6)';
  running = false; paused = true;
  playPauseBtn.textContent = '▶';
  hintEl.textContent = t().tapBegin;
  sessCycles.textContent = t().cycleLabel(1, totalCycles);
  sessionEl.classList.add('show');
  document.body.style.overflow='hidden';
}

function buildDots(){
  cycleDots.innerHTML='';
  for(let i=0;i<totalCycles;i++){
    const d = document.createElement('div');
    d.className='cycle-dot';
    cycleDots.appendChild(d);
  }
}
function updateDots(){
  [...cycleDots.children].forEach((d,i)=>{
    d.classList.toggle('done', i<cycleIdx);
    d.classList.toggle('current', i===cycleIdx);
  });
}

function orbTargetScale(key){
  if(key==='Inhale') return 1;
  if(key==='Exhale') return 0.6;
  return null;
}

function startPhase(){
  phaseIdx++;
  if(phaseIdx >= phases.length){
    phaseIdx = 0; cycleIdx++;
    if(cycleIdx >= totalCycles){ finishSession(); return; }
  }
  const p = phases[phaseIdx];
  phaseDurMs = p.dur*1000;
  remainingMs = phaseDurMs;
  sessCycles.textContent = t().cycleLabel(cycleIdx+1, totalCycles);
  updateDots();
  phaseLabelEl.textContent = t().phases[p.idx];
  phaseLabelEl.style.color = (p.key==='Hold') ? 'var(--amber)' : color;
  countEl.textContent = p.dur;

  const target = orbTargetScale(p.key);
  if(currentAnim) currentAnim.cancel();
  if(target !== null){
    currentAnim = orb.animate(
      [{transform:`scale(${p.key==='Inhale'?0.6:1})`},{transform:`scale(${target})`}],
      {duration:phaseDurMs, easing:'ease-in-out', fill:'forwards'}
    );
  } else {
    const holdScale = (phases[(phaseIdx-1+phases.length)%phases.length].key==='Inhale') ? 1 : 0.6;
    orb.style.transform = `scale(${holdScale})`;
    currentAnim = orb.animate(
      [{transform:`scale(${holdScale})`},{transform:`scale(${holdScale*1.015})`},{transform:`scale(${holdScale})`}],
      {duration:phaseDurMs, easing:'ease-in-out'}
    );
  }

  ringProgress.style.transition = 'none';
  ringProgress.setAttribute('stroke-dashoffset', RING_PERIM);
  requestAnimationFrame(()=>{
    ringProgress.style.transition = `stroke-dashoffset ${phaseDurMs}ms linear`;
    ringProgress.setAttribute('stroke-dashoffset', 0);
  });

  playPhaseCue(p.key, p.dur);
  vibratePhase(p.key);
}

function tick(){
  if(paused) return;
  remainingMs -= 100;
  const secs = Math.max(0, Math.ceil(remainingMs/1000));
  countEl.textContent = secs;
  if(remainingMs <= 0){
    startPhase();
  }
}

function playSession(){
  ensureAudio();
  if(!running){
    running = true; paused = false;
    startPhase();
  } else {
    paused = false;
    if(currentAnim) currentAnim.play();
  }
  playPauseBtn.textContent = '❚❚';
  hintEl.textContent = '';
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, 100);
}
function pauseSession(){
  paused = true;
  playPauseBtn.textContent = '▶';
  hintEl.textContent = t().paused;
  if(currentAnim) currentAnim.pause();
  ringProgress.style.transition = 'none';
}
function togglePlay(){
  if(paused) playSession(); else pauseSession();
}
function skipPhase(){
  if(!running) return;
  if(currentAnim) currentAnim.cancel();
  startPhase();
  if(paused){ paused=false; playPauseBtn.textContent='❚❚'; if(tickTimer) clearInterval(tickTimer); tickTimer=setInterval(tick,100); }
}
function finishSession(){
  clearInterval(tickTimer);
  if(currentAnim) currentAnim.cancel();
  running = false;
  const totalSec = phases.reduce((a,p)=>a+p.dur,0) * totalCycles;
  const mm = Math.floor(totalSec/60), ss = totalSec%60;
  document.getElementById('completeTitle').textContent = t().complete;
  document.getElementById('completeSub').textContent = t().completeSub;
  document.getElementById('statCyclesLabel').textContent = t().statCycles;
  document.getElementById('statTimeLabel').textContent = t().statTime;
  document.getElementById('completeDone').textContent = t().done;
  document.getElementById('completeAgain').textContent = t().repeat;
  document.getElementById('statCycles').textContent = totalCycles;
  document.getElementById('statTime').textContent = `${mm}:${ss.toString().padStart(2,'0')}`;
  phaseLabelEl.textContent = '';
  completeEl.classList.add('show');
  if(vibeOn && navigator.vibrate) navigator.vibrate([40,60,40,60,120]);
}
function closeSession(){
  clearInterval(tickTimer);
  if(currentAnim) currentAnim.cancel();
  sessionEl.classList.remove('show');
  document.body.style.overflow='';
  running = false; paused = true;
}

playPauseBtn.onclick = togglePlay;
document.getElementById('skipBtn').onclick = skipPhase;
document.getElementById('stopBtn').onclick = closeSession;
document.getElementById('sessionClose').onclick = closeSession;
document.getElementById('completeDone').onclick = closeSession;
document.getElementById('completeAgain').onclick = ()=>{
  completeEl.classList.remove('show');
  startSession(currentExercise, currentCatColor, totalCycles);
};
</script>
</body>
</html>
