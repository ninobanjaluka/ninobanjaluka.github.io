<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Tidework — Breathing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #080B10;
    --bg-2: #0D131B;
    --surface: #121A24;
    --surface-2: #17212C;
    --border: #223040;
    --text: #E8EEF3;
    --text-dim: #7E8FA0;
    --text-faint: #4C5A69;
    --accent: #38BDF8;
    --accent-soft: #38BDF833;
    --amber: #F5A524;
    --radius: 20px;
    --pad: 20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 20% -10%, #0e1b26 0%, transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, #131b12 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overscroll-behavior:none;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    padding-bottom:40px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px var(--pad) 8px;
    gap:8px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-size:clamp(18px,5.2vw,22px);
    font-weight:600;
    letter-spacing:0.2px;
    white-space:nowrap;
  }
  .brand .dot{color:var(--accent);}
  .toggles{ display:flex; gap:7px; flex-shrink:0; }
  .icon-btn{
    min-width:36px; height:36px; padding:0 8px; border-radius:11px;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); cursor:pointer; font-size:15px;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn.active{ color:var(--text); border-color:var(--accent); background:var(--accent-soft); }
  .icon-btn:active{ transform: scale(0.94); }
  #langToggle{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:11.5px; letter-spacing:.5px; }

  /* ---------- Category tabs ---------- */
  .tabs{
    display:flex; gap:8px; padding:14px var(--pad) 4px;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:9px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-dim);
    font-size:clamp(12px,3.4vw,13.5px); font-weight:600;
    cursor:pointer; white-space:nowrap;
    transition:.15s;
  }
  .tab.active{ color:#081014; border-color:transparent; }

  .category-block{ padding:18px var(--pad) 6px; }
  .category-title{
    font-family:'Fraunces', serif;
    font-size:clamp(21px,6.4vw,26px); font-weight:600; margin:6px 0 8px;
  }
  .category-desc{
    color:var(--text-dim); font-size:clamp(13px,3.6vw,14.5px); line-height:1.5; margin:0 0 18px;
    max-width:42ch;
  }

  /* ---------- Cards grid ---------- */
  .grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:0 var(--pad) 10px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 12px 12px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: transform .15s, border-color .15s, background .15s;
    min-height:104px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .card::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(120px 80px at 100% 0%, var(--accent-soft), transparent 70%);
    opacity:0; transition:opacity .2s;
  }
  .card:active{ transform: scale(0.97); }
  .card:hover{ border-color:var(--accent); }
  .card:hover::before{ opacity:1; }
  .card-name{
    font-family:'Fraunces', serif;
    font-weight:600; font-size:clamp(15.5px,4.6vw,18.5px); margin-bottom:6px; position:relative;
    line-height:1.15;
  }
  .card-pattern{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(10.5px,2.9vw,12.5px); color:var(--text-dim); letter-spacing:1.5px;
    margin-bottom:10px; position:relative;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; position:relative;
  }
  .level{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
  }
  .level.Easy{ color:#4ADE80; }
  .level.Intermediate{ color:var(--amber); }
  .level.Complex{ color:#FB7185; }
  .card-arrow{
    width:24px; height:24px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent); font-size:13px;
  }

  /* ---------- Session sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(4,6,9,0.72);
    backdrop-filter: blur(6px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
    z-index:50;
  }
  .sheet-overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px;
    background:var(--bg-2);
    border:1px solid var(--border); border-bottom:none;
    border-radius:22px 22px 0 0;
    padding:20px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet-overlay.show .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px; border-radius:2px; background:var(--border);
    margin:0 auto 16px;
  }
  .sheet-title{ font-family:'Fraunces', serif; font-size:clamp(20px,5.8vw,24px); font-weight:600; margin:0 0 4px; }
  .sheet-sub{ color:var(--text-dim); font-size:13.5px; margin:0 0 16px; }
  .phase-preview{
    display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;
  }
  .phase-chip{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:7px 6px; flex:1; min-width:62px;
  }
  .phase-chip .n{ font-family:'JetBrains Mono', monospace; font-size:16px; font-weight:700; }
  .phase-chip .l{ font-size:9.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.3px; }
  .field-label{ font-size:12px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin:14px 0 8px; }
  .cycle-options{ display:flex; gap:7px; }
  .cycle-opt{
    flex:1; padding:11px 0; text-align:center; border-radius:12px;
    background:var(--surface); border:1px solid var(--border);
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px;
    color:var(--text-dim); cursor:pointer; transition:.15s;
  }
  .cycle-opt.active{ color:#081014; border-color:transparent; }
  .begin-btn{
    width:100%; margin-top:20px; padding:15px; border:none; border-radius:14px;
    font-family:'Inter'; font-weight:700; font-size:15.5px; color:#081014;
    cursor:pointer; letter-spacing:.2px;
  }

  /* ---------- Session screen ---------- */
  .session{
    position:fixed; inset:0; background:var(--bg);
    display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:60;
  }
  .session.show{ transform:translateY(0); }
  .session-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(16px + env(safe-area-inset-top)) 16px 0;
    gap:8px;
  }
  .close-btn, .mini-toggle{
    width:38px;height:38px;border-radius:11px;background:var(--surface);
    border:1px solid var(--border); display:flex;align-items:center;justify-content:center;
    color:var(--text-dim); cursor:pointer; font-size:17px; flex-shrink:0;
  }
  .session-title{ text-align:center; min-width:0; overflow:hidden; }
  .session-title .name{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(14px,4vw,16px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .session-title .cycles{ font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono', monospace; letter-spacing:.5px; }
  .mini-toggles{ display:flex; gap:7px; flex-shrink:0; }

  .stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; padding:14px;
    min-height:0;
  }
  .orb-wrap{
    position:relative;
    width:min(280px, 62vw, 42vh);
    height:min(280px, 62vw, 42vh);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .ring-svg{ position:absolute; inset:0; transform:rotate(-90deg); width:100%; height:100%; }
  .ring-bg{ fill:none; stroke:var(--border); stroke-width:3; }
  .ring-progress{ fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; transition:none; }
  .orb-glow{
    position:absolute; width:93%; height:93%; border-radius:50%;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    filter:blur(6px);
  }
  .orb{
    width:64%; height:64%; border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #ffffff22, transparent 55%), var(--accent);
    box-shadow: 0 0 60px var(--accent-soft), inset 0 0 40px rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
  }
  .orb .count{
    font-family:'JetBrains Mono', monospace; font-size:clamp(28px,9vw,44px); font-weight:700; color:#081014;
  }
  .phase-label{
    font-family:'Fraunces', serif; font-size:clamp(21px,6.4vw,30px); font-weight:600; margin-top:clamp(14px,4vh,30px);
    color:var(--text); min-height:34px; text-align:center; letter-spacing:.3px;
  }
  .cycle-dots{ display:flex; gap:5px; margin-top:12px; flex-wrap:wrap; justify-content:center; max-width:260px; }
  .cycle-dot{ width:6px; height:6px; border-radius:50%; background:var(--border); transition:.2s; flex-shrink:0; }
  .cycle-dot.done{ background:var(--accent); }
  .cycle-dot.current{ background:var(--text); transform:scale(1.3); }

  .session-bottom{
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:14px;
    flex-shrink:0;
  }
  .ctrl-btn{
    width:52px; height:52px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--text);
    cursor:pointer; font-size:18px; flex-shrink:0;
  }
  .ctrl-btn.primary{ background:var(--accent); color:#081014; width:66px; height:66px; font-size:22px; border:none; }
  .hint{ text-align:center; color:var(--text-faint); font-size:11.5px; padding-bottom:4px; min-height:16px; flex-shrink:0; }

  /* ---------- Complete overlay ---------- */
  .complete{
    position:absolute; inset:0; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .3s; text-align:center; padding:24px;
  }
  .complete.show{ opacity:1; pointer-events:auto; }
  .complete .check{
    width:66px;height:66px;border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex;align-items:center;justify-content:center; font-size:28px; margin-bottom:16px;
  }
  .complete h2{ font-family:'Fraunces', serif; font-size:clamp(21px,6vw,26px); margin:0 0 6px; }
  .complete p{ color:var(--text-dim); font-size:14px; margin:0 0 22px; max-width:32ch; }
  .complete-stats{ display:flex; gap:24px; margin-bottom:26px; }
  .complete-stats div{ text-align:center; }
  .complete-stats .v{ font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; }
  .complete-stats .k{ font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }
  .complete-actions{ display:flex; gap:10px; width:100%; max-width:280px; }
  .complete-actions button{
    flex:1; padding:13px; border-radius:14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-ghost{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .btn-solid{ background:var(--accent); border:none; color:#081014; }

  /* ---------- Very small screens ---------- */
  @media (max-width:360px){
    :root{ --pad:14px; }
    .topbar{ padding-top:16px; }
    .icon-btn{ min-width:32px; height:32px; font-size:13px; }
    .grid{ gap:8px; }
    .card{ padding:11px 10px 10px; min-height:92px; }
    .card-arrow{ width:21px; height:21px; }
    .phase-chip{ min-width:52px; padding:6px 4px; }
    .cycle-opt{ padding:9px 0; font-size:12.5px; }
    .ctrl-btn{ width:46px; height:46px; font-size:16px; }
    .ctrl-btn.primary{ width:58px; height:58px; font-size:19px; }
  }
  @media (max-height:680px){
    .phase-label{ margin-top:10px; }
    .cycle-dots{ margin-top:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .sheet, .session, .complete{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">Tidework<span class="dot">.</span></div>
    <div class="toggles">
      <div class="icon-btn" id="langToggle" title="Jezik / Language">EN</div>
      <div class="icon-btn active" id="soundToggle" title="Sound cues">🔊</div>
      <div class="icon-btn active" id="vibeToggle" title="Vibration cues">📳</div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="category-block">
    <div class="category-title" id="catTitle"></div>
    <p class="category-desc" id="catDesc"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- Pre-session config sheet -->
<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Exercise</div>
    <p class="sheet-sub" id="sheetSub">Easy · Rest & Relax</p>
    <div class="phase-preview" id="phasePreview"></div>
    <div class="field-label" id="lengthLabel">Session length</div>
    <div class="cycle-options" id="cycleOptions"></div>
    <button class="begin-btn" id="beginBtn">Begin</button>
  </div>
</div>

<!-- Session screen -->
<div class="session" id="session">
  <div class="session-top">
    <div class="close-btn" id="sessionClose">✕</div>
    <div class="session-title">
      <div class="name" id="sessName">Exercise</div>
      <div class="cycles" id="sessCycles">CYCLE 1 / 8</div>
    </div>
    <div class="mini-toggles">
      <div class="mini-toggle" id="sessSound">🔊</div>
      <div class="mini-toggle" id="sessVibe">📳</div>
    </div>
  </div>

  <div class="stage">
    <div class="orb-wrap">
      <div class="orb-glow"></div>
      <svg class="ring-svg" viewBox="0 0 280 280">
        <circle class="ring-bg" cx="140" cy="140" r="130"></circle>
        <circle class="ring-progress" id="ringProgress" cx="140" cy="140" r="130" stroke-dasharray="816.8" stroke-dashoffset="816.8"></circle>
      </svg>
      <div class="orb" id="orb"><div class="count" id="count">3</div></div>
    </div>
    <div class="phase-label" id="phaseLabel">Get ready</div>
    <div class="cycle-dots" id="cycleDots"></div>

    <div class="complete" id="complete">
      <div class="check">✓</div>
      <h2 id="completeTitle">Session complete</h2>
      <p id="completeSub">Nicely done. Notice how you feel.</p>
      <div class="complete-stats">
        <div><div class="v" id="statCycles">8</div><div class="k" id="statCyclesLabel">Cycles</div></div>
        <div><div class="v" id="statTime">3:12</div><div class="k" id="statTimeLabel">Time</div></div>
      </div>
      <div class="complete-actions">
        <button class="btn-ghost" id="completeDone">Done</button>
        <button class="btn-solid" id="completeAgain">Repeat</button>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">Tap to begin</div>
  <div class="session-bottom">
    <div class="ctrl-btn" id="stopBtn">✕</div>
    <div class="ctrl-btn primary" id="playPauseBtn">▶</div>
    <div class="ctrl-btn" id="skipBtn">⏭</div>
  </div>
</div>

<script>
/* ============ I18N ============ */
const I18N = {
  en: {
    tapBegin: 'Tap play to begin', paused: 'Paused', getReady: 'Get ready',
    sessionLength: 'Session length', cyclesWord: 'cycles', begin: 'Begin',
    cycleLabel: (c,t)=>`CYCLE ${c} / ${t}`,
    complete: 'Session complete', completeSub: 'Nicely done. Notice how you feel.',
    statCycles: 'Cycles', statTime: 'Time', done: 'Done', repeat: 'Repeat',
    phases: ['Inhale','Hold','Exhale','Hold'],
    levels: {Easy:'Easy', Intermediate:'Intermediate', Complex:'Complex'},
  },
  sr: {
    tapBegin: 'Dodirni plej da počneš', paused: 'Pauzirano', getReady: 'Spremi se',
    sessionLength: 'Dužina sesije', cyclesWord: 'ciklusa', begin: 'Počni',
    cycleLabel: (c,t)=>`CIKLUS ${c} / ${t}`,
    complete: 'Sesija završena', completeSub: 'Odlično urađeno. Obrati pažnju kako se osećaš.',
    statCycles: 'Ciklusa', statTime: 'Vreme', done: 'Gotovo', repeat: 'Ponovi',
    phases: ['Udah','Zadrži','Izdah','Zadrži'],
    levels: {Easy:'Lako', Intermediate:'Srednje', Complex:'Napredno'},
  }
};
let LANG = 'en';
const PHASE_KEYS = ['Inhale','Hold','Exhale','Hold'];

/* ============ DATA ============ */
const CATEGORIES = [
  {
    id:'rest', color:'#38BDF8',
    name:{en:'Rest & Relax', sr:'Odmor i opuštanje'},
    desc:{en:'A set of breathing exercises to help you relax and calm down. Try these when you are stressed, tense or worried.',
          sr:'Skup vežbi disanja koje pomažu da se opustiš i smiriš. Isprobaj ih kada si pod stresom, napet ili zabrinut.'},
    exercises:[
      {name:{en:'Recover', sr:'Oporavak'}, pattern:[3,2,4,2], level:'Easy'},
      {name:{en:'Detach', sr:'Odvajanje'}, pattern:[3,3,6,3], level:'Easy'},
      {name:{en:'Calm', sr:'Smirenost'}, pattern:[4,1,6,1], level:'Intermediate'},
      {name:{en:'Unwind', sr:'Rasterećenje'}, pattern:[4,4,6,2], level:'Intermediate'},
      {name:{en:'Tranquility', sr:'Spokojstvo'}, pattern:[6,1,8,1], level:'Complex'},
      {name:{en:'Fall Asleep', sr:'Uspavljivanje'}, pattern:[4,7,8,0], level:'Complex'},
    ]
  },
  {
    id:'balance', color:'#2DD4BF',
    name:{en:'Balance & Resilience', sr:'Ravnoteža i otpornost'},
    desc:{en:'Use your breath to regain your balance. These exercises harmonize the body and mind.',
          sr:'Koristi dah da povratiš ravnotežu. Ove vežbe usklađuju telo i um.'},
    exercises:[
      {name:{en:'Balance', sr:'Ravnoteža'}, pattern:[4,1,4,1], level:'Easy'},
      {name:{en:'Coherence', sr:'Usklađenost'}, pattern:[5,0,5,0], level:'Easy'},
      {name:{en:'Resonance', sr:'Rezonanca'}, pattern:[5,1,5,1], level:'Intermediate'},
      {name:{en:'Harmony', sr:'Harmonija'}, pattern:[6,1,6,1], level:'Intermediate'},
      {name:{en:'Flow', sr:'Tok'}, pattern:[6,2,6,2], level:'Complex'},
      {name:{en:'Awareness', sr:'Svesnost'}, pattern:[8,2,8,2], level:'Complex'},
    ]
  },
  {
    id:'focus', color:'#C6F135',
    name:{en:'Focus & Performance', sr:'Fokus i učinak'},
    desc:{en:'The perfect exercises to focus and concentrate. Try these when you need to perform at your best.',
          sr:'Idealne vežbe za fokus i koncentraciju. Isprobaj ih kada treba da daš svoj maksimum.'},
    exercises:[
      {name:{en:'Focus', sr:'Fokus'}, pattern:[3,3,3,3], level:'Easy'},
      {name:{en:'Clarity', sr:'Jasnoća'}, pattern:[4,4,4,4], level:'Easy'},
      {name:{en:'Wake Up', sr:'Buđenje'}, pattern:[4,1,2,1], level:'Intermediate'},
      {name:{en:'Espresso', sr:'Espreso'}, pattern:[5,1,3,1], level:'Intermediate'},
      {name:{en:'Recharge', sr:'Punjenje energije'}, pattern:[6,1,3,1], level:'Complex'},
      {name:{en:'Endurance', sr:'Izdržljivost'}, pattern:[6,6,6,6], level:'Complex'},
    ]
  }
];

/* ============ STATE ============ */
let activeCat = CATEGORIES[0];
let soundOn = true, vibeOn = true;
let currentExercise = null, currentCatColor = '#38BDF8';
let chosenCycles = 8;
function t(){ return I18N[LANG]; }

/* ============ RENDER HOME ============ */
const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const catTitle = document.getElementById('catTitle');
const catDesc = document.getElementById('catDesc');

function renderTabs(){
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'tab' + (c.id===activeCat.id ? ' active':'');
    el.textContent = c.name[LANG];
    if(c.id===activeCat.id){ el.style.background=c.color; el.style.borderColor=c.color; }
    el.onclick = ()=>{ activeCat=c; renderAll(); };
    tabsEl.appendChild(el);
  });
}
function renderCategory(){
  catTitle.textContent = activeCat.name[LANG];
  catTitle.style.color = activeCat.color;
  catDesc.textContent = activeCat.desc[LANG];
}
function renderGrid(){
  gridEl.innerHTML = '';
  activeCat.exercises.forEach(ex=>{
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML = `
      <div>
        <div class="card-name" style="color:${activeCat.color}">${ex.name[LANG]}</div>
        <div class="card-pattern">${ex.pattern.join('&nbsp;&nbsp;')}</div>
      </div>
      <div class="card-foot">
        <div class="level ${ex.level}">${t().levels[ex.level]}</div>
        <div class="card-arrow" style="background:${activeCat.color}22; color:${activeCat.color}">→</div>
      </div>`;
    card.onclick = ()=> openSheet(ex, activeCat.color, activeCat.name[LANG]);
    gridEl.appendChild(card);
  });
}
function renderAll(){ renderTabs(); renderCategory(); renderGrid(); }
renderAll();

document.getElementById('langToggle').onclick = function(){
  LANG = (LANG==='en') ? 'sr' : 'en';
  this.textContent = LANG.toUpperCase();
  renderAll();
  syncMiniToggles();
};

document.getElementById('soundToggle').onclick = function(){
  soundOn = !soundOn; this.classList.toggle('active', soundOn); this.textContent = soundOn?'🔊':'🔇';
  syncMiniToggles();
};
document.getElementById('vibeToggle').onclick = function(){
  vibeOn = !vibeOn; this.classList.toggle('active', vibeOn); this.textContent = vibeOn?'📳':'📴';
  syncMiniToggles();
};
function syncMiniToggles(){
  const s=document.getElementById('sessSound'), v=document.getElementById('sessVibe');
  s.textContent = soundOn?'🔊':'🔇'; s.style.color = soundOn ? '' : 'var(--text-faint)';
  v.textContent = vibeOn?'📳':'📴'; v.style.color = vibeOn ? '' : 'var(--text-faint)';
}
document.getElementById('sessSound').onclick = ()=> document.getElementById('soundToggle').click();
document.getElementById('sessVibe').onclick = ()=> document.getElementById('vibeToggle').click();

/* ============ PRE-SESSION SHEET ============ */
const sheetOverlay = document.getElementById('sheetOverlay');
const sheetTitle = document.getElementById('sheetTitle');
const sheetSub = document.getElementById('sheetSub');
const phasePreview = document.getElementById('phasePreview');
const cycleOptions = document.getElementById('cycleOptions');
const beginBtn = document.getElementById('beginBtn');
const lengthLabel = document.getElementById('lengthLabel');

function openSheet(ex, color, catName){
  currentExercise = ex; currentCatColor = color;
  sheetTitle.textContent = ex.name[LANG];
  sheetTitle.style.color = color;
  sheetSub.textContent = `${t().levels[ex.level]} · ${catName}`;
  lengthLabel.textContent = t().sessionLength;
  phasePreview.innerHTML = '';
  ex.pattern.forEach((sec,i)=>{
    if(sec<=0) return;
    const chip = document.createElement('div');
    chip.className='phase-chip';
    chip.innerHTML = `<div class="n" style="color:${color}">${sec}s</div><div class="l">${t().phases[i]}</div>`;
    phasePreview.appendChild(chip);
  });
  cycleOptions.innerHTML='';
  [4,8,12].forEach(n=>{
    const opt = document.createElement('div');
    opt.className='cycle-opt' + (n===8 ? ' active':'');
    if(n===8){ opt.style.background=color; opt.style.borderColor=color; }
    opt.textContent = n+' '+t().cyclesWord;
    opt.onclick = ()=>{
      chosenCycles = n;
      [...cycleOptions.children].forEach(c=>{c.classList.remove('active'); c.style.background=''; c.style.borderColor='';});
      opt.classList.add('active'); opt.style.background=color; opt.style.borderColor=color;
    };
    cycleOptions.appendChild(opt);
  });
  chosenCycles = 8;
  beginBtn.textContent = t().begin;
  beginBtn.style.background = color;
  beginBtn.onclick = ()=>{ closeSheet(); startSession(ex, color, chosenCycles); };
  sheetOverlay.classList.add('show');
}
function closeSheet(){ sheetOverlay.classList.remove('show'); }
sheetOverlay.onclick = (e)=>{ if(e.target===sheetOverlay) closeSheet(); };

/* ============ AUDIO ============ */
let actx = null;
function ensureAudio(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); }
function tone(freqStart, freqEnd, duration, type='sine', peakGain=0.09){
  if(!soundOn || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,40), t0+duration);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(peakGain, t0+Math.min(0.35,duration*0.3));
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0); osc.stop(t0+duration+0.05);
  return {osc, gain};
}
function chime(freq1, freq2){
  if(!soundOn || !actx) return;
  const t0 = actx.currentTime;
  [freq1, freq2].forEach((f,i)=>{
    if(!f) return;
    const osc = actx.createOscillator(); const gain = actx.createGain();
    osc.type='sine'; osc.frequency.setValueAtTime(f, t0+i*0.09);
    gain.gain.setValueAtTime(0.0001, t0+i*0.09);
    gain.gain.exponentialRampToValueAtTime(0.16, t0+i*0.09+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.09+0.28);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0+i*0.09); osc.stop(t0+i*0.09+0.3);
  });
}
function playPhaseCue(key, duration){
  if(!soundOn) return;
  ensureAudio();
  if(key==='Inhale'){ chime(392,523); tone(220,440,duration,'sine',0.05); }
  else if(key==='Exhale'){ chime(523,392); tone(440,220,duration,'sine',0.05); }
  else { chime(330,330); }
}
function vibratePhase(key){
  if(!vibeOn || !navigator.vibrate) return;
  if(key==='Inhale') navigator.vibrate([50]);
  else if(key==='Exhale') navigator.vibrate([90]);
  else navigator.vibrate([25,60,25]);
}

/* ============ SESSION ENGINE ============ */
const sessionEl = document.getElementById('session');
const orb = document.getElementById('orb');
const countEl = document.getElementById('count');
const phaseLabelEl = document.getElementById('phaseLabel');
const ringProgress = document.getElementById('ringProgress');
const sessName = document.getElementById('sessName');
const sessCycles = document.getElementById('sessCycles');
const cycleDots = document.getElementById('cycleDots');
const completeEl = document.getElementById('complete');
const hintEl = document.getElementById('hint');
const playPauseBtn = document.getElementById('playPauseBtn');
const RING_CIRC = 2*Math.PI*130;
ringProgress.setAttribute('stroke-dasharray', RING_CIRC);

let phases = [];
let phaseIdx = 0;
let cycleIdx = 0;
let totalCycles = 8;
let remainingMs = 0;
let phaseDurMs = 0;
let running = false;
let paused = true;
let tickTimer = null;
let currentAnim = null;
let color = '#38BDF8';

function buildPhases(pattern){
  return pattern.map((sec,i)=>({key:PHASE_KEYS[i], idx:i, dur:sec})).filter(p=>p.dur>0);
}

function startSession(ex, col, cycles){
  color = col; totalCycles = cycles;
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--accent-soft', color+'33');
  phases = buildPhases(ex.pattern);
  phaseIdx = -1; cycleIdx = 0;
  sessName.textContent = ex.name[LANG];
  orb.style.background = `radial-gradient(circle at 32% 28%, #ffffff22, transparent 55%), ${color}`;
  orb.style.boxShadow = `0 0 60px ${color}55, inset 0 0 40px rgba(0,0,0,0.25)`;
  document.querySelector('.orb-glow').style.background = `radial-gradient(circle, ${color}44 0%, transparent 70%)`;
  ringProgress.style.stroke = color;
  buildDots();
  completeEl.classList.remove('show');
  phaseLabelEl.textContent = t().getReady;
  countEl.textContent = '';
  ringProgress.setAttribute('stroke-dashoffset', RING_CIRC);
  orb.style.transform = 'scale(0.6)';
  running = false; paused = true;
  playPauseBtn.textContent = '▶';
  hintEl.textContent = t().tapBegin;
  sessCycles.textContent = t().cycleLabel(1, totalCycles);
  sessionEl.classList.add('show');
  document.body.style.overflow='hidden';
}

function buildDots(){
  cycleDots.innerHTML='';
  for(let i=0;i<totalCycles;i++){
    const d = document.createElement('div');
    d.className='cycle-dot';
    cycleDots.appendChild(d);
  }
}
function updateDots(){
  [...cycleDots.children].forEach((d,i)=>{
    d.classList.toggle('done', i<cycleIdx);
    d.classList.toggle('current', i===cycleIdx);
  });
}

function orbTargetScale(key){
  if(key==='Inhale') return 1;
  if(key==='Exhale') return 0.6;
  return null;
}

function startPhase(){
  phaseIdx++;
  if(phaseIdx >= phases.length){
    phaseIdx = 0; cycleIdx++;
    if(cycleIdx >= totalCycles){ finishSession(); return; }
  }
  const p = phases[phaseIdx];
  phaseDurMs = p.dur*1000;
  remainingMs = phaseDurMs;
  sessCycles.textContent = t().cycleLabel(cycleIdx+1, totalCycles);
  updateDots();
  phaseLabelEl.textContent = t().phases[p.idx];
  phaseLabelEl.style.color = (p.key==='Hold') ? '#F5A524' : color;
  countEl.textContent = p.dur;

  const target = orbTargetScale(p.key);
  if(currentAnim) currentAnim.cancel();
  if(target !== null){
    currentAnim = orb.animate(
      [{transform:`scale(${p.key==='Inhale'?0.6:1})`},{transform:`scale(${target})`}],
      {duration:phaseDurMs, easing:'ease-in-out', fill:'forwards'}
    );
  } else {
    const holdScale = (phases[(phaseIdx-1+phases.length)%phases.length].key==='Inhale') ? 1 : 0.6;
    orb.style.transform = `scale(${holdScale})`;
    currentAnim = orb.animate(
      [{transform:`scale(${holdScale})`},{transform:`scale(${holdScale*1.015})`},{transform:`scale(${holdScale})`}],
      {duration:phaseDurMs, easing:'ease-in-out'}
    );
  }

  ringProgress.style.transition = 'none';
  ringProgress.setAttribute('stroke-dashoffset', RING_CIRC);
  requestAnimationFrame(()=>{
    ringProgress.style.transition = `stroke-dashoffset ${phaseDurMs}ms linear`;
    ringProgress.setAttribute('stroke-dashoffset', 0);
  });

  playPhaseCue(p.key, p.dur);
  vibratePhase(p.key);
}

function tick(){
  if(paused) return;
  remainingMs -= 100;
  const secs = Math.max(0, Math.ceil(remainingMs/1000));
  countEl.textContent = secs;
  if(remainingMs <= 0){
    startPhase();
  }
}

function playSession(){
  ensureAudio();
  if(!running){
    running = true; paused = false;
    startPhase();
  } else {
    paused = false;
    if(currentAnim) currentAnim.play();
  }
  playPauseBtn.textContent = '❚❚';
  hintEl.textContent = '';
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, 100);
}
function pauseSession(){
  paused = true;
  playPauseBtn.textContent = '▶';
  hintEl.textContent = t().paused;
  if(currentAnim) currentAnim.pause();
  ringProgress.style.transition = 'none';
}
function togglePlay(){
  if(paused) playSession(); else pauseSession();
}
function skipPhase(){
  if(!running) return;
  if(currentAnim) currentAnim.cancel();
  startPhase();
  if(paused){ paused=false; playPauseBtn.textContent='❚❚'; if(tickTimer) clearInterval(tickTimer); tickTimer=setInterval(tick,100); }
}
function finishSession(){
  clearInterval(tickTimer);
  if(currentAnim) currentAnim.cancel();
  running = false;
  const totalSec = phases.reduce((a,p)=>a+p.dur,0) * totalCycles;
  const mm = Math.floor(totalSec/60), ss = totalSec%60;
  document.getElementById('completeTitle').textContent = t().complete;
  document.getElementById('completeSub').textContent = t().completeSub;
  document.getElementById('statCyclesLabel').textContent = t().statCycles;
  document.getElementById('statTimeLabel').textContent = t().statTime;
  document.getElementById('completeDone').textContent = t().done;
  document.getElementById('completeAgain').textContent = t().repeat;
  document.getElementById('statCycles').textContent = totalCycles;
  document.getElementById('statTime').textContent = `${mm}:${ss.toString().padStart(2,'0')}`;
  phaseLabelEl.textContent = '';
  completeEl.classList.add('show');
  if(vibeOn && navigator.vibrate) navigator.vibrate([40,60,40,60,120]);
}
function closeSession(){
  clearInterval(tickTimer);
  if(currentAnim) currentAnim.cancel();
  sessionEl.classList.remove('show');
  document.body.style.overflow='';
  running = false; paused = true;
}

playPauseBtn.onclick = togglePlay;
document.getElementById('skipBtn').onclick = skipPhase;
document.getElementById('stopBtn').onclick = closeSession;
document.getElementById('sessionClose').onclick = closeSession;
document.getElementById('completeDone').onclick = closeSession;
document.getElementById('completeAgain').onclick = ()=>{
  completeEl.classList.remove('show');
  startSession(currentExercise, currentCatColor, totalCycles);
};
</script>
